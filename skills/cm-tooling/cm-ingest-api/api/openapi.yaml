{ "openapi": "3.1.0","info": { "title": "CoreMedia Ingest Service","version": "4.0" },"servers": [ { "url": "/coremedia/api/ingest/v4/","description": "Default Server URL" } ],"paths": { "/repository/withdraw-all": { "post": { "tags": [ "Repository" ],"summary": "Withdraw (unpublish) the given set of content items","description": "Withdraws the given set of content items in one bulk operation.<br>On each item the withdrawal flag is set and its place is approved before unpublication. If an item is a folder, the operation is applied recursively to all children.<br>The bulk operation is not executed in one transaction. If the operation fails, content items might be in an intermediate state, for example having the withdrawal flag set but not unpublished yet. In this case, check the result's error messages for detailed information.","operationId": "withdrawAll","requestBody": { "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ContentIdList" } } },"required": true },"responses": { "200": { "description": "The bulk operation result.<br>A result code of 200 does not imply a successfully executed operation. For this, check the <i>successful</i> flag of the result.","content": { "application/json": { "schema": { "$ref": "#/components/schemas/ResponseDataModelBulkResult" } } } },"400": { "description": "The request or its input data is invalid.<br>Examples include invalid names, referring to nonexistent content or property types or invalid property values.<br>Refer to the error items for detailed information.","content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorResponse" } } } },"401": { "description": "The request is missing a valid authentication","content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorResponse" } } } },"403": { "description": "The user is missing the necessary authorization to perform the operation on the requested content item","content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorResponse" } } } },"429": { "description": "The request cannot be processed due to capacity limits.<br>This can happen if you request bulk updates and all internal workers are busy and job queues are full.<br>In such a case clients should wait for a short moment and retry the operation.","content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorResponse" } } } },"500": { "description": "An error was encountered while processing the request.<br>Refer to the error items for detailed information.","content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorResponse" } } } } } } },"/repository/withdraw-all-async": { "post": { "tags": [ "Repository" ],"summary": "Withdraw (unpublish) the given set of content items asynchronously","description": "Withdraws the given set of content items in one asynchronous bulk operation.<br>On each item the withdrawal flag is set and its place is approved before unpublication. If an item is a folder, the operation is applied recursively to all children.<br>The bulk operation is not executed in one transaction. If the operation fails, content items might be in an intermediate state, for example having the withdrawal flag set but not unpublished yet.<br>This call returns the initial state upon scheduling the operation. Updates can be fetched by using the returned ID from the initial state (see method /jobs/{id}).","operationId": "withdrawAllAsync","requestBody": { "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ContentIdList" } } },"required": true },"responses": { "202": { "description": "The initial state of the asynchronous bulk operation","content": { "application/json": { "schema": { "$ref": "#/components/schemas/ResponseDataModelAsyncJobResult" } } } },"400": { "description": "The request or its input data is invalid.<br>Examples include invalid names, referring to nonexistent content or property types or invalid property val