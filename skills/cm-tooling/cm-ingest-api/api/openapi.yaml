me the premier provider for supplies for restaurants. From large appliances to expert kitchen design and delivery all the way to services like financing - we are committed to delivering expert solutions with the personal attention you deserve.</p></div>" },"caption": { "type": "Markup","value": "<div xmlns=\"http://www.coremedia.com/2003/richtext-1.0\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"><p dir=\"ltr\">Chef Corp. Headquarter</p></div>" },"alt": { "type": "String","value": "Chef Corp. Headquarter" },"data": { "type": "TempBlob","id": "e41504dc-c888-11eb-b8bc-0242ac130055","mimeType": "image/jpeg","size": 544331 } } } } } },"required": true },"responses": { "201": { "description": "Response model with the created content","content": { "application/json": { "schema": { "$ref": "#/components/schemas/ResponseDataModelContentData" } } } },"400": { "description": "The request or its input data is invalid.<br>Examples include invalid IDs or names, referring to nonexistent content or property types or invalid property values.<br>Refer to the error items for detailed information.","content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorResponse" } } } },"401": { "description": "The request is missing a valid authentication","content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorResponse" } } } },"403": { "description": "The user is missing the necessary authorization to perform the operation on the requested content item","content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorResponse" } } } },"409": { "description": "The requested operation conflicts with an existing resource.<br>Refer to the error items for detailed information.","content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorResponse" } } } },"500": { "description": "An error was encountered while processing the request.<br>Refer to the error items for detailed information.","content": { "application/