 "The user is missing the necessary authorization to perform the operation on the requested content item","content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorResponse" } } } },"429": { "description": "The request cannot be processed due to capacity limits.<br>This can happen if you request bulk updates and all internal workers are busy and job queues are full.<br>In such a case clients should wait for a short moment and retry the operation.","content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorResponse" } } } },"500": { "description": "An error was encountered while processing the request.<br>Refer to the error items for detailed information.","content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorResponse" } } } } } } },"/repository/delete-all-async": { "post": { "tags": [ "Repository" ],"summary": "Delete the given set of content items asynchronously","description": "Unpublishes and moves the given set of content items to the recycle bin in one asynchronous bulk operation.<br>On each item the withdrawal flag is set and its place is approved before unpublication. After unpublication, all items are moved to the recycle bin. If an item is a folder, the operation is applied recursively to all children.<br>The bulk operation is not executed in one transaction. If the operation fails, content items might be in an intermediate state, for example having the withdrawal flag set but not deleted yet.<br>This call returns the initial state upon scheduling the operation. Updates can be fetched by using the returned ID from the initial state (see method /jobs/{id}).","operationId": "deleteAllAsync","requestBody": { "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ContentIdList" } } },"required": true },"responses": { "202": { "description": "The initial state of the asynchronous bulk operation","content": { "application/json": { "schema": { "$ref": "#/components/sch