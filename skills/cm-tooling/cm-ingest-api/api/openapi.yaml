ore publication. Additionally, the folders up to the root are place approved and published for each item if needed. If an item is a folder, the operation is applied recursively to all children.<br>The bulk operation is not executed in one transaction. If the operation fails, content items might be in an intermediate state, for example fully approved but not published yet.<br>This call returns the initial state upon scheduling the operation. Updates can be fetched by using the returned ID from the initial state (see method /jobs/{id}).","operationId": "publishAllAsync","requestBody": { "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ContentIdList" } } },"required": true },"responses": { "202": { "description": "The initial state of the asynchronous bulk operation","content": { "application/json": { "schema": { "$ref": "#/components/schemas/ResponseDataModelAsyncJobResult" } } } },"400": { "description": "The request or its input data is invalid.<br>Examples include invalid names, referring to nonexistent content or property types or invalid property values.<br>Refer to the error items for detailed information.","content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorResponse" } } } },"401": { "description": "The request is missing a valid authentication","content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorResponse" } } } },"403": { "description": "The user is missing the necessary authorization to perform the operation on the requested content item","content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorResponse" } } } },"429": { "description": "The request cannot be processed due to capacity limits.<br>This can happen if you request bulk updates and all internal workers are busy and job queues are full.<br>In such a case clients should wait for a short moment and retry the operation.","content": { "application/json": { "schema": { "$ref": "#/components/sch