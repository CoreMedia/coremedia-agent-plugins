
openapi: 3.0.1
info:
  title: CMCC Service API
  version: "0.1"
servers:
  - url: https://api.dior.coremedia.cloud
    description: CMCC-S API server
paths:
  /v1/token:
    post:
      operationId: createToken
      description: Provides an expiring authentication token to be used for further
        API requests
      x-amazon-apigateway-integration:
        httpMethod: POST
        uri: arn:aws:apigateway:eu-central-1:lambda:path/2015-03-31/functions/arn:aws:lambda:eu-central-1:297373782916:function:endpoint_token/invocations
        passthroughBehavior: when_no_match
        payloadFormatVersion: "2.0"
        timeoutInMillis: 30000
        type: aws_proxy
      requestBody:
        description: Token generation request body
        content:
          application/json:
            schema: &a12
              type: object
              properties:
                ttl:
                  type: integer
                  description: Time to live in minutes before the token expires.
                  default: 10
                  maximum: 1440
      responses:
        "200":
          description: Successful creation of an authentication token.
          content:
            application/json:
              schema: &a11
                type: object
                properties:
                  data:
                    description: Contains the token and related information
                    type: object
                    properties:
                      token:
                        description: The JWT
                        type: string
                      expires_at:
                        description: Unix epoch time when the returned token expires
                        type: integer
        4XX:
          description: Client errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  body:
                    type: object
                    properties:
                      error:
                        description: A message that provides further details about the error
                        type: string
                      errorCode:
                        description: The unique error code as integer
                        type: string
        5XX:
          description: Server errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  body:
                    type: object
                    properties:
                      error:
                        description: A message that provides further details about the error
                        type: string
                      errorCode:
                        description: The unique error code as integer
                        type: string
      tags:
        - Identity
  /v1/environments:
    get:
      operationId: getEnvironments
      description: List all environments the user is permitted to see
      x-amazon-apigateway-integration:
        httpMethod: POST
        uri: arn:aws:apigateway:eu-central-1:lambda:path/2015-03-31/functions/arn:aws:lambda:eu-central-1:297373782916:function:endpoint_environments/invocations
        passthroughBehavior: when_no_match
        payloadFormatVersion: "2.0"
        timeoutInMillis: 30000
        type: aws_proxy
      responses:
        "200":
          description: Information about the available environments
          content:
            application/json:
              schema: &a14
                type: object
                properties:
                  data:
                    description: Contains information about the available environments
                    type: object
                    properties:
                      environments:
                        description: List of environments
                        type: array
                        items:
                          type: string
        4XX:
          description: Client errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  body:
                    type: object
                    properties:
                      error:
                        description: A message that provides further details about the error
                        type: string
                      errorCode:
                        description: The unique error code as integer
                        type: string
        5XX:
          description: Server errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  body:
                    type: object
                    properties:
                      error:
                        description: A message that provides further details about the error
                        type: string
                      errorCode:
                        description: The unique error code as integer
                        type: string
      tags:
        - Configuration
  /v1/environments/{env}/deployments:
    get:
      operationId: getDeploymentHistory
      description: List the history of self-service deployments for the specified
        environment.
      parameters:
        - in: path
          name: env
          schema:
            type: string
            enum: [ development,uat,uat2,uat3,production ]
          required: true
          description: Environment name
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          required: false
          description: "Number of deployments being returned (default: 10, maximum: 100)"
      x-amazon-apigateway-integration:
        httpMethod: POST
        uri: arn:aws:apigateway:eu-central-1:lambda:path/2015-03-31/functions/arn:aws:lambda:eu-central-1:297373782916:function:endpoint_environments_deployments_history/invocations
        passthroughBehavior: when_no_match
        payloadFormatVersion: "2.0"
        timeoutInMillis: 30000
        type: aws_proxy
      responses:
        "200":
          description: Last 10 deployments
          content:
            application/json:
              schema: &a22
                type: object
                properties:
                  data:
                    description: Container for the historical deployment data
                    type: object
                    properties:
                      deployments:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            environment:
                              type: string
                            dockerTag:
                              type: string
                              description: Will be 'n/a' if the tag can't be determined.
                            startDate:
                              type: string
                            stopDate:
                              type: string
                              description: Will be 0000-00-00T00:00:00Z as long as the deployment is running.
                            duration:
                              type: string
                              description: "Total duration of the deployment. Format: 00h00m00s. Will be 0 as long as the deployment is running."
                            status:
                              type: string
                              enum:
                                - FAILED
                                - RUNNING
                                - SUCCEEDED
                          example:
                            id: a1b2c34d-1111-99aa-94e7-6a1c8d5edfdb
                            environment: development
                            dockerTag: tag-2307.1_123456
                            startDate: 2021-11-01T22:07:39Z
                            stopDate: 2021-11-01T22:17:40Z
                            duration: 00h:10m:01s
                            status: SUCCEEDED
        4XX:
          description: Client errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  body:
                    type: object
                    properties:
                      error:
                        description: A message that provides further details about the error
                        type: string
                      errorCode:
                        description: The unique error code as integer
                        type: string
        5XX:
          description: Server errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  body:
                    type: object
                    properties:
                      error:
                        description: A message that provides further details about the error
                        type: string
                      errorCode:
                        description: The unique error code as integer
                        type: string
      tags:
        - Deployments
    post:
      operationId: triggerDeployment
      description: Start a self-service deployment for the specified environment.
      parameters:
        - in: path
          name: env
          schema:
            type: string
            enum: [ development,uat,uat2,uat3,production ]
          required: true
          description: Environment name
      x-amazon-apigateway-integration:
        httpMethod: POST
        uri: arn:aws:apigateway:eu-central-1:lambda:path/2015-03-31/functions/arn:aws:lambda:eu-central-1:297373782916:function:endpoint_environments_deployments_trigger/invocations
        passthroughBehavior: when_no_match
        payloadFormatVersion: "2.0"
        timeoutInMillis: 30000
        type: aws_proxy
      requestBody:
        description: ""
        content:
          application/json:
            schema: &a18
              properties:
                image_tag:
                  type: string
                  description: Docker image tag to be deployed.
                force:
                  type: boolean
                  description: Force the deployment even if there is an existing self-service
                    deployment lock.
                rollingDeliveryDeployment:
                  type: boolean
                  default: true
                  description: Deploy without delivery downtime
                client:
                  type: string
                  default: Swagger
                  description: System calling this event
      responses:
        "201":
          description: Information about the triggered deployment
          content:
            application/json:
              schema: &a17
                type: object
                properties:
                  data:
                    description: Container for the information about the triggered deployment
                    type: object
                    properties:
                      deployment:
                        type: object
                        properties:
                          id:
                            type: string
                          environment:
                            type: string
                          startDate:
                            type: string
                    example:
                      id: a1b2c34d-1111-99aa-94e7-6a1c8d5edfdb
                      environment: development
                      startDate: 2021-11-01T22:07:39Z
        4XX:
          description: Client errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  body:
                    type: object
                    properties:
                      error:
                        description: A message that provides further details about the error
                        type: string
                      errorCode:
                        description: The unique error code as integer
                        type: string
        5XX:
          description: Server errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  body:
                    type: object
                    properties:
                      error:
                        description: A message that provides further details about the error
                        type: string
                      errorCode:
                        description: The unique error code as integer
                        type: string
      tags:
        - Deployments
  /v1/environments/{env}/deployments/lock:
    get:
      operationId: getLock
      description: Get current self service deployment lock
      parameters:
        - in: path
          name: env
          schema:
            type: string
            enum: [ development,uat,uat2,uat3,production ]
          required: true
          description: Environment name
      x-amazon-apigateway-integration:
        httpMethod: POST
        uri: arn:aws:apigateway:eu-central-1:lambda:path/2015-03-31/functions/arn:aws:lambda:eu-central-1:297373782916:function:endpoint_environments_deployments_lock_get/invocations
        passthroughBehavior: when_no_match
        payloadFormatVersion: "2.0"
        timeoutInMillis: 30000
        type: aws_proxy
      responses:
        "200":
          description: Show the current self service deployment lock
          content:
            application/json:
              schema: &a24
                type: object
                properties:
                  data:
                    description: Container for the information about the lock.
                    type: object
                    properties:
                      lock:
                        type: object
                        properties:
                          deploymentId:
                            type: string
                          lockReason:
                            type: string
                          operatorLock:
                            type: boolean
                          message:
                            type: string
                          startDate:
                            type: string
                        example:
                          deploymentId: deployment-id
                          lockReason: Deployment in progress,
                          operatorLock: false
                          message: Lock set,
                          startDate: 2021-11-11T16:53:07Z,
        4XX:
          description: Client errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  body:
                    type: object
                    properties:
                      error:
                        description: A message that provides further details about the error
                        type: string
                      errorCode:
                        description: The unique error code as integer
                        type: string
        5XX:
          description: Server errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  body:
                    type: object
                    properties:
                      error:
                        description: A message that provides further details about the error
                        type: string
                      errorCode:
                        description: The unique error code as integer
                        type: string
      tags:
        - Deployments
  /v1/environments/{env}/deployments/{deployment}:
    get:
      operationId: getDeploymentStatus
      description: Provide the current state of the specified self-service deployment
        and environment.
      parameters:
        - in: path
          name: env
          schema:
            type: string
            enum: [ development,uat,uat2,uat3,production ]
          required: true
          description: Environment name
        - in: path
          name: deployment
          schema:
            type: string
          required: true
          description: The deployment ID of a deployment from the deployment history
      x-amazon-apigateway-integration:
        httpMethod: POST
        uri: arn:aws:apigateway:eu-central-1:lambda:path/2015-03-31/functions/arn:aws:lambda:eu-central-1:297373782916:function:endpoint_environments_deployments_get/invocations
        passthroughBehavior: when_no_match
        payloadFormatVersion: "2.0"
        timeoutInMillis: 30000
        type: aws_proxy
      responses:
        "200":
          description: Show the status of the deployment
          content:
            application/json:
              schema: &a23
                type: object
                properties:
                  data:
                    description: Container for the information about the deployment.
                    type: object
                    properties:
                      deployment:
                        type: object
                        properties:
                          id:
                            type: string
                          environment:
                            type: string
                          dockerTag:
                            type: string
                            description: Will be 'n/a' if the tag can't be determined.
                          startDate:
                            type: string
                          stopDate:
                            type: string
                            description: Will be 0000-00-00T00:00:00Z as long as the deployment is running.
                          duration:
                            type: string
                            description: "Total duration of the execution. Format: 00h00m00s. Will be 0 as long as the deployment is running."
                          status:
                            type: string
                            enum:
                              - FAILED
                              - RUNNING
                              - SUCCEEDED
                          lock:
                            type: object
                            properties:
                              operatorLock:
                                type: boolean
                                description: True if this is an operator lock, or false, if this is a standard
                                  deployment lock.
                              lockReason:
                                type: string
                                description: The reason why the lock has been set.
                          failedReasons:
                            type: array
                            items:
                              type: string
                              description: Reason why deployment failed.
                        example:
                          id: 68a70698-f86b-4a5d-808e-08b3477d6005,
                          environment: development,
                          dockerTag: tag-2107.1_123456
                          startDate: 2021-11-11T16:53:07Z,
                          status: SUCCEEDED,
                          stopDate: 2021-11-11T17:03:35Z,
                          duration: 0h:10m:27s
        4XX:
          description: Client errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  body:
                    type: object
                    properties:
                      error:
                        description: A message that provides further details about the error
                        type: string
                      errorCode:
                        description: The unique error code as integer
                        type: string
        5XX:
          description: Server errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  body:
                    type: object
                    properties:
                      error:
                        description: A message that provides further details about the error
                        type: string
                      errorCode:
                        description: The unique error code as integer
                        type: string
      tags:
        - Deployments
  /v1/environments/{env}/deployments/{deployment}/redeploy:
    post:
      operationId: triggerRedeployment
      description: >-
        Start a self-service deployment with the image tag and properties as
        defined for the specified self-service deployment and environment.

        See manual for more details.
      parameters:
        - in: path
          name: env
          schema:
            type: string
            enum: [ development,uat,uat2,uat3,production ]
          required: true
          description: Environment name
        - in: path
          name: deployment
          schema:
            type: string
          required: true
          description: The deployment ID of a deployment from the deployment history.
      x-amazon-apigateway-integration:
        httpMethod: POST
        uri: arn:aws:apigateway:eu-central-1:lambda:path/2015-03-31/functions/arn:aws:lambda:eu-central-1:297373782916:function:endpoint_environments_deployments_trigger_redeploy/invocations
        passthroughBehavior: when_no_match
        payloadFormatVersion: "2.0"
        timeoutInMillis: 30000
        type: aws_proxy
      requestBody:
        description: ""
        content:
          application/json:
            schema: &a16
              type: object
              required:
                - client
              properties:
                force:
                  type: boolean
                  default: false
                  description: Force the deployment even if there is an existing self-service
                    deployment lock.
                rollingDeliveryDeployment:
                  type: boolean
                  default: true
                  description: Deploy without delivery downtime.
                client:
                  type: string
                  default: Swagger
                  description: System calling this event.
      responses:
        "201":
          description: Information about the triggered deployment
          content:
            application/json:
              schema: &a15
                type: object
                properties:
                  data:
                    description: Container for the information about the triggered deployment
                    type: object
                    properties:
                      deployment:
                        type: object
                        properties:
                          id:
                            type: string
                          environment:
                            type: string
                          startDate:
                            type: string
                          redeploymentId:
                            type: string
                          redeploymentTimestampInMs:
                            type: integer
                        example:
                          id: a1b2c34d-1111-99aa-94e7-6a1c8d5edfdb
                          environment: development
                          startDate: 2021-11-01T22:07:39Z
        4XX:
          description: Client errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  body:
                    type: object
                    properties:
                      error:
                        description: A message that provides further details about the error
                        type: string
                      errorCode:
                        description: The unique error code as integer
                        type: string
        5XX:
          description: Server errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  body:
                    type: object
                    properties:
                      error:
                        description: A message that provides further details about the error
                        type: string
                      errorCode:
                        description: The unique error code as integer
                        type: string
      tags:
        - Deployments
  /v1/environments/{env}/deployments/{deployment}/properties:
    get:
      operationId: getProperties
      description: List the image tag and all explicitly configured non-protected
        property key-value pairs across all containers for the given
        self-service deployment and environment.
      parameters:
        - in: path
          name: env
          schema:
            type: string
            enum: [ development,uat,uat2,uat3,production ]
          required: true
          description: Environment name
        - in: path
          name: deployment
          schema:
            type: string
          required: true
          description: The deployment ID of a deployment from the deployment history;
            output properties correspond to the properties activate for the
            given deployment ID.
      x-amazon-apigateway-integration:
        httpMethod: POST
        uri: arn:aws:apigateway:eu-central-1:lambda:path/2015-03-31/functions/arn:aws:lambda:eu-central-1:297373782916:function:endpoint_environments_deployments_properties_get/invocations
        passthroughBehavior: when_no_match
        payloadFormatVersion: "2.0"
        timeoutInMillis: 30000
        type: aws_proxy
      responses:
        "200":
          description: List of all configured non-protected property key-value pairs
            across all containers and the image tag.
          content:
            application/json:
              schema: &a21
                type: object
                properties:
                  data:
                    description: This object contains objects identified by the environment name
                      that provide the list of property key-value pairs
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: object
                        properties:
                          key:
                            description: Property name
                            type: string
                          value:
                            description: Property value
                            type: object
        4XX:
          description: Client errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  body:
                    type: object
                    properties:
                      error:
                        description: A message that provides further details about the error
                        type: string
                      errorCode:
                        description: The unique error code as integer
                        type: string
        5XX:
          description: Server errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  body:
                    type: object
                    properties:
                      error:
                        description: A message that provides further details about the error
                        type: string
                      errorCode:
                        description: The unique error code as integer
                        type: string
      tags:
        - Deployments
  /v1/environments/{env}/deployments/{deployment}/properties/restore:
    post:
      operationId: restoreProperties
      description: Restore the image tag and all properties of all containers to the
        values of the given self-service deployment and environment.
      parameters:
        - in: path
          name: env
          schema:
            type: string
            enum: [ development,uat,uat2,uat3,production ]
          required: true
          description: Environment name
        - in: path
          name: deployment
          schema:
            type: string
          required: true
          description: The deployment ID of a deployment from the deployment history; the
            image tag and container properties of this deployment ID will be
            restored.
      x-amazon-apigateway-integration:
        httpMethod: POST
        uri: arn:aws:apigateway:eu-central-1:lambda:path/2015-03-31/functions/arn:aws:lambda:eu-central-1:297373782916:function:endpoint_environments_deployments_properties_restore/invocations
        passthroughBehavior: when_no_match
        payloadFormatVersion: "2.0"
        timeoutInMillis: 30000
        type: aws_proxy
      requestBody:
        description: Information about the triggered deployment
        content:
          application/json:
            schema: &a20
              type: object
              required:
                - comment
              properties:
                comment:
                  type: string
                  description: Comment why you want to rollback properties
      responses:
        "200":
          description: Information about the triggered deployment
          content:
            application/json:
              schema: &a19
                type: object
                properties:
                  data:
                    description: Container for the information about rolled back state
                    type: object
                    properties:
                      rollback_status:
                        type: string
        4XX:
          description: Client errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  body:
                    type: object
                    properties:
                      error:
                        description: A message that provides further details about the error
                        type: string
                      errorCode:
                        description: The unique error code as integer
                        type: string
        5XX:
          description: Server errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  body:
                    type: object
                    properties:
                      error:
                        description: A message that provides further details about the error
                        type: string
                      errorCode:
                        description: The unique error code as integer
                        type: string
      tags:
        - Deployments
  /v1/environments/{env}/containers-properties:
    get:
      operationId: latestProperties
      description: List the latest, but not necessarily deployed, image tag and
        explicitly configured non-protected property key-value pairs across all
        containers for the given environment.
      parameters:
        - in: path
          name: env
          schema:
            type: string
            enum: [ development,uat,uat2,uat3,production ]
          required: true
          description: Environment name
      x-amazon-apigateway-integration:
        httpMethod: POST
        uri: arn:aws:apigateway:eu-central-1:lambda:path/2015-03-31/functions/arn:aws:lambda:eu-central-1:297373782916:function:endpoint_configuration_get_properties_latest/invocations
        passthroughBehavior: when_no_match
        payloadFormatVersion: "2.0"
        timeoutInMillis: 30000
        type: aws_proxy
      responses:
        "200":
          description: Latest, but not necessarily deployed, image tag and explicitly
            configured non-protected property key-value pairs across all
            containers for the given environment.
          content:
            application/json:
              schema: &a13
                type: object
                properties:
                  data:
                    description: This object contains objects identified by the environment name
                      that provide the latest configured, but not necessarily
                      deployed, key-value pairs
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: object
                        properties:
                          key:
                            description: Property name
                            type: string
                          value:
                            description: Property value
                            type: object
        4XX:
          description: Client errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  body:
                    type: object
                    properties:
                      error:
                        description: A message that provides further details about the error
                        type: string
                      errorCode:
                        description: The unique error code as integer
                        type: string
        5XX:
          description: Server errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  body:
                    type: object
                    properties:
                      error:
                        description: A message that provides further details about the error
                        type: string
                      errorCode:
                        description: The unique error code as integer
                        type: string
      tags:
        - Configuration
  /v1/environments/{env}/containers-images:
    get:
      operationId: getContainersImagesForEnvironment
      description: List all available container images that are compatible to the
        currently running AEP.
      parameters:
        - in: path
          name: env
          schema:
            type: string
            enum: [ development,uat,uat2,uat3,production ]
          required: true
          description: Environment name
      x-amazon-apigateway-integration:
        httpMethod: POST
        uri: arn:aws:apigateway:eu-central-1:lambda:path/2015-03-31/functions/arn:aws:lambda:eu-central-1:297373782916:function:endpoint_environments_containers_images/invocations
        passthroughBehavior: when_no_match
        payloadFormatVersion: "2.0"
        timeoutInMillis: 30000
        type: aws_proxy
      responses:
        "200":
          description: List of available & compatible container images
          content:
            application/json:
              schema: &a25
                type: object
                properties:
                  data:
                    description: Container for the requested images per environment
                    type: object
                    properties:
                      imageTags:
                        type: array
                        items:
                          type: string
        4XX:
          description: Client errors
          content:
            application/json:
              schema:
                type: object
